<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yokka Beach Club — Menus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    <style>
        :root{
            --cream:#f5efe1;
            --ink:#2c2013;
            --ink-soft:#4a3a26;
            --olive:#7c8c5c;
            --olive-deep:#5c6b3f;
        }
        *{box-sizing:border-box; margin:0; padding:0;}
        body{
            background: var(--cream);
            color: var(--ink);
            font-family:'Cormorant Garamond', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .container{
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .logo{
            display:block;
            width: 220px;
            max-width: 70vw;
            height: auto;
            margin: 0 auto 1rem;
        }
        h1{
            font-family:'Playfair Display', serif;
            font-weight:600;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .subtitle{
            font-style: italic;
            font-size: 1.1rem;
            color: var(--ink-soft);
            margin-bottom: 2.5rem;
        }
        .lang-btn{
            display: block;
            width: 100%;
            padding: 1rem 1.5rem;
            margin: 0.75rem 0;
            font-family:'Cormorant Garamond', serif;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--ink);
            background: rgba(124,140,92,0.08);
            border: 1px solid var(--olive-deep);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        .lang-btn:hover{
            background: var(--olive-deep);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="../res.png" alt="Yokka Beach Club" class="logo">
        <p class="subtitle">Choisissez votre langue / Choose your language / Kies uw taal</p>
        
        <a href="menuFR.html" class="lang-btn">Français</a>
        <a href="menuEN.html" class="lang-btn">English</a>
        <a href="menuNL.html" class="lang-btn">Nederlands</a>
    </div>
</body>
</html>
